<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שלשות · לייב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: courtside scorer's table — loud, quick, readable from a meter away
   IDEA: the hardwood floor itself; the five racks drawn on a half court
   PICTURE: a top-down half court with every ball of the rack, filling as shots fall
   COLOUR and TYPE: maple wood ground, painted-key red, ball orange; Karantina numerals, Rubik text
   LAYOUT: one column for a phone in hand; sticky tabs; full-screen shooting mode */
:root{color-scheme:light dark;
--bg:light-dark(#f1dbb3,#1c130c);--wood2:light-dark(#e8cc9b,#26190f);--card:light-dark(#fbf1de,#2c1e13);
--ink:light-dark(#22160c,#f6e9d6);--mut:light-dark(#6b543d,#bba68b);--line:light-dark(#22160c26,#f6e9d624);
--paint:light-dark(#c41f2e,#e2434f);--ball:#f2681c;--ballDk:#a8410a;--gold:light-dark(#b07c09,#f0c14b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 54px,var(--line) 54px 55px);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;min-height:44px;padding:0 16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--ball);color:#fff;box-shadow:0 3px 0 var(--ballDk);font-weight:700}
.dk{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:700}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);padding:10px max(4vw,14px) 0}
.brand{display:flex;align-items:center;gap:10px}.brand b{font:700 34px/1 Karantina,sans-serif}.brand span{color:var(--mut);font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
nav button{background:none;box-shadow:none;border-radius:10px 10px 0 0;font-weight:500;color:var(--mut);flex:none}
nav button.on{background:var(--ink);color:var(--bg)}
nav[hidden]{display:none}
main{max-width:760px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h1{font:700 clamp(40px,9vw,56px)/1 Karantina,sans-serif;margin:0 0 4px;text-wrap:balance}
h2{font:700 30px/1.05 Karantina,sans-serif;margin:26px 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line),inset 0 0 0 1.5px var(--line)}
.court svg{display:block;width:100%;height:auto;max-height:36vh;margin:0 auto}
.cl{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:2}
.floor{fill:var(--wood2)}
.paint{fill:var(--paint);fill-opacity:.9;stroke:var(--ink);stroke-opacity:.5;stroke-width:2}
.rim{fill:none;stroke:var(--ball);stroke-width:3}
.b{fill:var(--card);stroke:var(--ink);stroke-opacity:.55;stroke-width:1.5;transition:fill .15s}
.b.mb{stroke:var(--paint);stroke-opacity:1;stroke-width:3}
.b.in{fill:var(--ball);stroke:var(--ballDk);stroke-opacity:1}
.b.mb.in{stroke:var(--paint)}
.b.out{fill:var(--ink);fill-opacity:.16;stroke-opacity:.2}
.b.now{stroke:var(--ball);stroke-width:3.5;stroke-opacity:1}
.spot{fill:var(--ink)}.spot.on{fill:var(--ball)}.spot.in{fill:var(--ball)}.spot.out{fill:var(--mut)}
.st{fill:var(--bg);font:700 13px Rubik,sans-serif;text-anchor:middle;dominant-baseline:central}
.lab{fill:var(--ink);font:500 12px Rubik,sans-serif;dominant-baseline:central}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.rules li{background:var(--bg);border-radius:99px;padding:4px 12px;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.rules li b{color:var(--paint)}
.order{counter-reset:o;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.order li{counter-increment:o;background:var(--card);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.order li::before{content:counter(o);font:700 24px/1 Karantina,sans-serif;color:var(--ball);min-width:1.2em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.acts>*{flex:1 1 140px}
.big{min-height:60px;font-size:19px}
.deck{display:grid;gap:4px;text-align:center;padding:20px 16px;background:var(--ink);color:var(--bg);box-shadow:none}
.deck .who{font:700 clamp(58px,16vw,86px)/.95 Karantina,sans-serif}
.deck .lbl,.deck .then{opacity:.75;font-size:15px}
.deck .tgt{font-weight:500;color:var(--ball)}
.deck button:not(.pri){background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--bg)}
.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{min-width:44px;padding:0 10px}.chips button.on{background:var(--paint);color:#fff;box-shadow:none}
.deck .chips button{color:var(--bg);background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}.deck .chips button.on{background:var(--paint);box-shadow:none}
.board{display:grid;gap:6px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 92px 46px;align-items:center;gap:10px;width:100%;text-align:start;padding:6px 12px;border-radius:12px}
.row .rk{font:700 26px/1 Karantina,sans-serif;color:var(--mut)}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--mut);font-weight:400;margin-inline-start:6px}
.row .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.row .bar i{display:block;height:100%;background:var(--ball);border-radius:9px}
.row .sc{font:700 30px/1 Karantina,sans-serif;text-align:end}
.row.q{box-shadow:inset 0 0 0 2px var(--ball)}.row.q .rk{color:var(--ball)}
.row.tie{box-shadow:inset 0 0 0 2px var(--paint)}
.cut{display:flex;align-items:center;gap:8px;color:var(--paint);font-size:13px;font-weight:700}.cut::before,.cut::after{content:"";flex:1;border-top:2px dashed currentColor}
.wait{color:var(--mut);font-size:15px}
details{margin-top:18px}summary{cursor:pointer;font-weight:500;min-height:44px;display:flex;align-items:center}
.set{display:grid;gap:10px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field input[type=number],select{width:96px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px}
.tg{width:56px;height:32px;border-radius:99px;position:relative;padding:0;min-height:32px;background:var(--line);box-shadow:none;flex:none}
.tg::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:inset-inline-start .15s}
.tg.on{background:var(--ball)}.tg.on::after{inset-inline-start:28px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.pl span{flex:1}.pl.off span{color:var(--mut);text-decoration:line-through}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
/* shooting mode */
.shoot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(4vw,12px) max(10px,env(safe-area-inset-bottom));overflow-y:auto;max-width:760px;margin:0 auto}
.shoot[hidden],.modal[hidden],.cd[hidden]{display:none}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sh-stage{color:var(--mut);font-size:14px}.sh-name{font:700 clamp(38px,10vw,52px)/1 Karantina,sans-serif}
.sh-score{text-align:end}.sh-score span{font:700 64px/.85 Karantina,sans-serif;color:var(--ball)}.sh-score small{display:block;color:var(--mut);font-size:13px}
.sh-timer{display:flex;align-items:center;gap:12px}
.tnum{font:700 clamp(76px,22vw,112px)/.8 Karantina,sans-serif;min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.tnum.low{color:var(--paint);animation:beat 1s infinite}
.tbox{flex:1;display:grid;gap:6px}.tbar{height:14px;border-radius:9px;background:var(--line);overflow:hidden}.tbar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .1s linear}
.tnum.low+.tbox .tbar i{background:var(--paint)}
.sh-where{font-weight:500;text-align:center;min-height:24px}.sh-where b{color:var(--paint)}
.hot{color:var(--ball);font-weight:800}
.sh-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-btns button{min-height:clamp(84px,14vh,120px);font:700 34px/1 Karantina,sans-serif;border-radius:20px}
.sh-btns small{font:500 16px Rubik,sans-serif;display:block;margin-top:4px;opacity:.85}
.bonus{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bn{background:var(--card);border-radius:14px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;box-shadow:inset 0 0 0 1.5px var(--line)}
.bn>div{grid-column:1/-1;display:flex;justify-content:space-between;font-size:14px}.bn>div span{color:var(--paint);font-weight:700}
.bn button{min-height:44px;padding:0 6px;font-size:15px}.bn button[data-v="1"]{background:var(--ball);color:#fff;box-shadow:none}
.bn em{grid-column:1/-1;font-style:normal;text-align:center;font-weight:700;padding:10px 0}.bn.y{box-shadow:inset 0 0 0 2px var(--ball)}.bn.y em{color:var(--ball)}.bn.n em{color:var(--mut)}
.sh-foot{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:auto}
.banner{background:var(--paint);color:#fff;text-align:center;border-radius:12px;padding:8px;font-weight:700}
.cd{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);font:700 min(46vw,260px)/1 Karantina,sans-serif;color:var(--ball);z-index:3}
/* modal */
.modal{position:fixed;inset:0;z-index:40;background:#0009;display:grid;place-items:end center;padding:12px}
.sheet{background:var(--bg);border-radius:22px;padding:20px;width:min(560px,100%);max-height:88vh;overflow-y:auto}
.sheet h3{font:700 38px/1 Karantina,sans-serif;margin:0 0 8px}
.mbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.mbtns button{flex:1 1 120px}
.dots{display:flex;gap:4px}.d{width:14px;height:14px;border-radius:50%;background:var(--line)}.d.y{background:var(--ball)}.d.m{box-shadow:0 0 0 2px var(--paint)}
.brk{display:grid;gap:6px;margin:10px 0}.brk div{display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea{width:100%;min-height:160px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px;font:14px/1.5 Rubik,sans-serif;color:var(--ink)}
/* champion */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:18px 0 6px}
.pd{text-align:center}.pd .n{font:700 clamp(26px,7vw,38px)/1 Karantina,sans-serif;overflow-wrap:anywhere}.pd .s{color:var(--mut);font-size:14px}
.pd .blk{margin-top:6px;border-radius:12px 12px 0 0;background:var(--ink);color:var(--bg);font:700 44px/1 Karantina,sans-serif;display:grid;place-items:center}
.pd.p1 .blk{height:130px;background:var(--ball);color:#fff}.pd.p2 .blk{height:94px}.pd.p3 .blk{height:70px}
.fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fun div{background:var(--card);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line)}.fun small{color:var(--mut);display:block;font-size:13px}.fun b{font:700 28px/1.05 Karantina,sans-serif;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
a.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:14px;background:#1f9e55;color:#fff;font-weight:700;text-decoration:none}
#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#conf{position:fixed;inset:0;pointer-events:none;z-index:45;width:100%;height:100%}
.empty{color:var(--mut);text-align:center;padding:20px}
div.row{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--paint);margin-inline-end:6px;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.tnum.low{animation:none}*{transition:none!important}}
@media(max-width:600px){.row{grid-template-columns:28px minmax(0,1fr) 54px 40px;gap:8px;padding:6px 8px}.sh-foot{grid-template-columns:1fr 1fr}.sh-foot #bSave{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#f2681c" stroke="#7a2e05" stroke-width="2"/><path d="M2 15h26M15 2v26M6 6c5 4 5 14 0 18M24 6c-5 4-5 14 0 18" fill="none" stroke="#7a2e05" stroke-width="1.6"/></svg><b>שלשות</b><span>תחרות הליגה של הקבוצה</span></div>
  <nav id="tabs"><button data-t="game">תחרות</button><button data-t="bets">הימורים</button><button data-t="players">שחקנים</button><button data-t="season">עונה</button></nav>
</header>
<main id="view"></main>

<section class="shoot" id="shoot" hidden aria-label="סיבוב זריקה">
  <div class="sh-top"><div><div class="sh-stage" id="shStage"></div><div class="sh-name" id="shName"></div></div><div class="sh-score"><span id="shScore">0</span><small id="shTgt"></small></div></div>
  <div class="sh-timer"><div class="tnum" id="tNum">90</div><div class="tbox"><div class="tbar"><i id="tBar"></i></div><div id="shHot" class="sh-stage"></div></div></div>
  <div id="shBanner"></div>
  <div class="court" id="shCourt"></div>
  <div class="sh-where" id="shWhere"></div>
  <div class="sh-btns"><button class="pri" id="bMake">נכנס</button><button class="dk" id="bMiss">החטיא<small>0</small></button></div>
  <div class="bonus" id="shBonus"></div>
  <div class="sh-foot"><button id="bUndo">בטל אחרון</button><button id="bAbort">יציאה</button><button class="pri" id="bSave">סיים עכשיו</button></div>
  <div class="cd" id="cd" hidden></div>
</section>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<canvas id="conf"></canvas>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF=['צחי','עומר','אלון','בן שך','גרופי','עמית','רועי','יובל','פישמן','עידן','שלום','רז','איתי','בן גל','חן'];
const KEY='shootout-v1',SKEY='shootout-season-v1';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fresh=(old,keepBets)=>({players:old?old.players:DEF.map(n=>({n,on:true})),cfg:old?old.cfg:{sec:90,every:10,last5:true,fin:3,money:false,voice:true,sound:true},order:old?old.order:DEF.slice(),stages:[],qual:[],podium:null,tab:'game',bets:old&&keepBets?old.bets||[]:[]});
let S=load(KEY,null)||fresh();
if(!Array.isArray(S.bets))S.bets=[];
let season=load(SKEY,[]);
const save=()=>{store(KEY,S);pushLive()};
let R=null,moneyPick=4;
let SYNC=false,REMOTE=null,roundBase=0,remoteRev=0,remoteBrev=0,lastSKey='',lastBKey='',lastCurKey='',lastCurPub=0,pubT=null,pubBusy=false,netOk=true;
const NT='https://ntfy.sh/',TOP='shlashot-1379e238c69c763f',TS=TOP+'-s',TB=TOP+'-b',TI=TOP+'-in',MKEY='manage-6e88fd6cd1';
const VIEW_URL='https://raw.githack.com/zahip/basketball-stats-app/shlashot/live.html';
const ME=(()=>{try{let d=localStorage.getItem('shootout-dev');if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem('shootout-dev',d)}return d}catch(e){return Math.random().toString(36).slice(2)}})();
const FORM_URL='https://raw.githack.com/zahip/basketball-stats-app/shlashot/index.html';

/* ---------- scoring ---------- */
const val=(m,i)=>(m===Math.floor(i/5)||i%5===4)?2:1;
const score=r=>r.balls.reduce((s,b,i)=>s+(b===1?val(r.money,i):0),0)+(r.b3===1?3:0)+(r.b5===1?5:0);
const maxScore=m=>score({balls:Array(25).fill(1),b3:1,b5:1,money:m});
const streakMax=b=>{let m=0,c=0;b.forEach(x=>{c=x===1?c+1:0;m=Math.max(m,c)});return m};
const stg=()=>S.stages[S.stages.length-1];
const nextUp=st=>st.order.filter(n=>!st.res[n]);
const ranked=st=>Object.entries(st.res).map(([n,r])=>({n,s:r.s,r})).sort((a,b)=>b.s-a.s);
const present=()=>{const on=S.players.filter(p=>p.on).map(p=>p.n);return S.order.filter(n=>on.includes(n)).concat(on.filter(n=>!S.order.includes(n)))};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qualOf=n=>S.stages[0]&&S.stages[0].res[n]?S.stages[0].res[n].s:0;
const isQual=st=>st.kind==='q'||st.kind==='soq';

/* ---------- sound & voice ---------- */
let AC=null,heVoice=null,voicesLoaded=false;
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC};
function tone(f,d=.12,type='sine',v=.22,when=0){if(!S.cfg.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
const sfx={make:()=>{tone(784,.09);tone(1175,.12,'sine',.2,.07)},money:()=>{tone(784,.08);tone(1175,.08,'sine',.2,.07);tone(1568,.16,'sine',.2,.14)},miss:()=>tone(180,.12,'triangle',.25),buzz:()=>{tone(150,.9,'sawtooth',.28);tone(152,.9,'square',.12)},hot:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.08,i*.07))};
function pickVoice(){try{const vs=speechSynthesis.getVoices();voicesLoaded=vs.length>0;heVoice=vs.find(v=>/^(he|iw)/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t,cut=true){if(!S.cfg.voice||!('speechSynthesis' in window))return;try{if(cut)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=1.08;speechSynthesis.speak(u)}catch(e){}}
let lock=null;async function wake(on){try{if(on&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen');else if(lock){lock.release();lock=null}}catch(e){}}

/* ---------- UI helpers ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
function modal(html,btns){const sh=$('#sheet');sh.innerHTML=html+'<div class="mbtns">'+btns.map((b,i)=>`<button data-i="${i}" class="${b.c||''}">${b.t}</button>`).join('')+'</div>';$('#modal').hidden=false;sh.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const f=btns[+b.dataset.i].f;closeM();f&&f()}}
const closeM=()=>{$('#modal').hidden=true};

/* ---------- court drawing ---------- */
const ANG=[10,50,90,130,170],BX=200,BY=28,RR=150;
function courtSVG(r){
  const money=r?r.money:(S.cfg.money?moneyPick:null);
  const ni=r?r.balls.indexOf(null):-1,cs=ni<0?-1:Math.floor(ni/5);
  let g=`<svg viewBox="0 0 400 314" role="img" aria-label="מפת העמדות במגרש"><rect class="floor" x="2" y="2" width="396" height="310" rx="6"/><rect class="cl" x="4" y="4" width="392" height="306"/><rect class="paint" x="152" y="4" width="96" height="128"/><path class="cl" d="M164 132A36 36 0 0 0 236 132"/><path class="cl" d="M350 4V28A150 150 0 0 1 50 28V4"/><path class="cl" d="M4 310H396M160 310A40 40 0 0 1 240 310" /><path d="M180 14H220" stroke="currentColor" stroke-width="3" style="color:var(--ink)"/><circle class="rim" cx="200" cy="26" r="7"/>`;
  ANG.forEach((a,s)=>{const t=a*Math.PI/180,c=Math.cos(t),n=Math.sin(t),px=BX+RR*c,py=BY+RR*n;
    for(let j=0;j<5;j++){const i=s*5+j,bx=px+c*26+(-n)*(j-2)*15,by=py+n*26+c*(j-2)*15,st=r?r.balls[i]:null;
      g+=`<circle class="b${val(money,i)===2?' mb':''}${st===1?' in':st===0?' out':''}${i===ni?' now':''}" cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${val(money,i)===2?7.5:6.5}"/>`}
    g+=`<circle class="spot${s===cs?' on':''}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="11"/><text class="st" x="${px.toFixed(1)}" y="${py.toFixed(1)}">${s+1}</text>`});
  [['b3',248,'¾','שלושת רבע · 3'],['b5',290,'½','חצי מגרש · 5']].forEach(([k,y,l,t])=>{const v=r?r[k]:null;g+=`<circle class="spot${v===1?' in':v===0?' out':''}" cx="200" cy="${y}" r="12"/><text class="st" x="200" y="${y}">${l}</text><text class="lab" x="218" y="${y}" text-anchor="end" direction="rtl">${t}</text>`});
  return g+'</svg>'}

/* ---------- flow ---------- */
function startTour(){const p=present();if(!p.length)return;S.order=p.concat(S.order.filter(n=>!p.includes(n)));S.stages=[{kind:'q',title:'מוקדמות',order:p,res:{},spots:Math.min(S.cfg.fin,p.length)}];S.qual=[];S.podium=null;S.rec=false;render();say('התחרות מתחילה! ראשון על הקו: '+p[0])}
function resolve(st){
  const r=ranked(st);
  if(isQual(st)){const k=st.spots,cut=r[k-1].s,above=r.filter(x=>x.s>cut).map(x=>x.n),tied=r.filter(x=>x.s===cut).map(x=>x.n);
    if(above.length+tied.length===k){S.qual.push(...above,...tied);return openFinal()}
    S.qual.push(...above);const sp=k-above.length;
    S.stages.push({kind:'soq',title:'שוט־אוף על הגמר',order:shuffle(tied),res:{},spots:sp});render();
    say(`שוויון! שוט אוף בין ${tied.join(', ')}`);
    modal(`<h3>שוויון על קו הגמר</h3><p>${tied.map(esc).join(', ')} סיימו עם ${cut} נקודות.</p><p>שוט־אוף: סיבוב מלא, ${sp===1?'מקום אחד':sp+' מקומות'} בגמר.${above.length?` כבר בגמר: ${above.map(esc).join(', ')}.`:''}</p>`,[{t:'יאללה',c:'pri'}])}
  else{const top=r[0].s,tied=r.filter(x=>x.s===top).map(x=>x.n);
    if(tied.length>1){S.stages.push({kind:'sof',title:'שוט־אוף על האליפות',order:tied,res:{},spots:1});render();say('שוויון בצמרת! שוט אוף על האליפות');modal(`<h3>שוויון בצמרת</h3><p>${tied.map(esc).join(' ו־')} סיימו עם ${top}. סיבוב מלא נוסף יכריע.</p>`,[{t:'יאללה',c:'pri'}])}
    else finish(r[0].n)}}
function openFinal(){
  const order=S.qual.slice().sort((a,b)=>qualOf(a)-qualOf(b));
  S.stages.push({kind:'f',title:'גמר',order,res:{},spots:1});render();
  say('העולים לגמר: '+order.slice().reverse().join(', '));
  modal(`<h3>העולים לגמר</h3><div class="board">${order.slice().reverse().map((n,i)=>`<div class="row q"><span class="rk">${i+1}</span><span class="nm">${esc(n)}</span><span></span><span class="sc">${qualOf(n)}</span></div>`).join('')}</div><p class="wait">בגמר מתחילים מאפס. סדר הזריקה: מהנמוך לגבוה — ${order.map(esc).join(' ← ')}.</p>`,[{t:'לגמר',c:'pri'}])}
function finish(w){
  const f=S.stages.find(s=>s.kind==='f'),last=stg(),fr=ranked(f);
  const rest=fr.filter(x=>x.n!==w).sort((a,b)=>b.s-a.s||((last.res[b.n]||{}).s||0)-((last.res[a.n]||{}).s||0));
  S.podium=[{n:w,s:f.res[w].s}].concat(rest.map(x=>({n:x.n,s:x.s})));
  if(!S.rec){S.rec=true;season.unshift({id:Date.now(),d:new Date().toLocaleDateString('he-IL'),podium:S.podium.map(x=>x.n),rounds:S.stages.flatMap(st=>Object.entries(st.res).map(([n,r])=>({n,s:r.s,k:st.kind})))});store(SKEY,season)}
  render();scrollTo(0,0);confetti();say(`והאלוף הוא… ${w}!`)}
function fullRank(){const fin=S.podium.map(x=>x.n),q=ranked(S.stages[0]).map(x=>x.n).filter(n=>!fin.includes(n));return fin.concat(q)}
function funStats(){
  const all=S.stages.flatMap(st=>Object.entries(st.res).map(([n,r])=>({n,r})));if(!all.length)return[];
  const best=all.reduce((a,b)=>b.r.s>a.r.s?b:a),hot=all.reduce((a,b)=>streakMax(b.r.balls)>streakMax(a.r.balls)?b:a);
  const mc=x=>x.r.balls.filter((b,i)=>b&&val(x.r.money,i)===2).length,mon=all.reduce((a,b)=>mc(b)>mc(a)?b:a);
  const bon={};all.forEach(x=>{bon[x.n]=(bon[x.n]||0)+(x.r.b3?3:0)+(x.r.b5?5:0)});const bk=Object.entries(bon).sort((a,b)=>b[1]-a[1])[0];
  const stp=[0,1,2,3,4].map(s=>all.reduce((t,x)=>t+x.r.balls.slice(s*5,s*5+5).filter(Boolean).length,0)/(all.length*5));const bs=stp.indexOf(Math.max(...stp));
  return[{k:'הסיבוב הכי גבוה',n:best.n,v:`${best.r.s} נקודות`},{k:'הרצף הכי חם',n:hot.n,v:`${streakMax(hot.r.balls)} ברצף`},{k:'מלך כדורי הכסף',n:mon.n,v:`${mc(mon)} כדורי כסף בסיבוב`},{k:'נקודות בונוס מרחוק',n:bk[1]?bk[0]:'אף אחד',v:bk[1]?`${bk[1]} נקודות`:'שלושת רבע וחצי נשארו בחוץ'},{k:'העמדה הכי חמה',n:`עמדה ${bs+1}`,v:`${Math.round(stp[bs]*100)}% קליעה`}]}
function shareText(){

  return [`🏀 תחרות שלשות · ${new Date().toLocaleDateString('he-IL')}`,'',...p.slice(0,3).map((x,i)=>`${m[i]} ${x.n} – ${x.s}`),'','מוקדמות:',...q.map((x,i)=>`${i+1}. ${x.n} – ${x.s}`),'',...funStats().map(f=>`${f.k}: ${f.n} (${f.v})`),...(bb.length?['','🎯 הימורים:',...bb.map((b,i)=>`${i+1}. ${b.name} – ${b.t}`)]:[])].join('\n')}

/* ---------- bets ---------- */
const nrm=s=>String(s).replace(/[‎‏"'׳״*_~]/g,'').replace(/\s+/g,' ').trim();
function findP(raw){const s=nrm(raw).replace(/\s*[–\-:]\s*\d+\s*$/,'');const all=S.players.map(p=>p.n);return all.find(n=>nrm(n)===s)||all.find(n=>nrm(n).replace(/ /g,'')===s.replace(/ /g,''))||null}
function parseBets(txt){const out=[];let cur=null;
  txt.split('\n').forEach(l=>{const h=l.match(/הימור שלשות\s*[–\-:]\s*(.+?)\s*$/);if(h){cur={name:nrm(h[1]),order:[]};out.push(cur);return}
    const m=l.match(/(?:^|\s)(\d{1,2})\s*[.)]\s*(.+?)\s*$/);if(cur&&m){const n=findP(m[2]);if(n&&!cur.order.includes(n))cur.order[+m[1]-1]=n}});
  return out.map(b=>({name:b.name.slice(0,24),order:b.order.filter(Boolean)})).filter(b=>b.name&&b.order.length>=3)}
function scoreBet(o,res){const ord=o.filter(n=>res.includes(n)),top=res.slice(0,3);let t=0,ex=0;
  res.forEach((n,i)=>{const j=ord.indexOf(n);if(j<0)return;const d=Math.abs(i-j);if(!d){t+=3;ex++}else if(d===1)t+=1});
  if(ord[0]&&ord[0]===res[0])t+=5;ord.slice(0,3).forEach(n=>{if(top.includes(n))t+=2});return{t,ex}}

  const qr=ranked(S.stages[0]).map(x=>x.n),f=S.stages.find(s=>s.kind==='f');if(!f)return qr;
  const fs=n=>f.res[n]?f.res[n].s:-1,fin=f.order.slice().sort((a,b)=>fs(b)-fs(a)||qualOf(b)-qualOf(a));
  return fin.concat(qr.filter(n=>!fin.includes(n)))}

async function post(topic,obj){try{const r=await fetch(NT+topic,{method:'POST',body:JSON.stringify(obj)});if(!r.ok)throw r.status;netOk=true;return true}catch(e){if(netOk)toast(e===429?'שרת הלייב עמוס — ננסה שוב עוד רגע':'אין חיבור ללייב — ננסה שוב');netOk=false;return false}}
async function latest(topic){for(const q of['since=latest','since=12h']){try{const r=await fetch(NT+topic+'/json?poll=1&'+q);if(!r.ok)continue;const ls=(await r.text()).trim().split('\n').filter(Boolean);for(let i=ls.length-1;i>=0;i--){const m=JSON.parse(ls[i]);if(m.event==='message')return JSON.parse(m.message)}return null}catch(e){}}return null}
async function allSince(topic){try{const r=await fetch(NT+topic+'/json?poll=1&since=12h');if(!r.ok)return[];return(await r.text()).trim().split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(m=>m&&m.event==='message')}catch(e){return[]}}

async function publishNow(){

    if(await post(TS,msg)){lastSKey=sk;lastCurKey=ck;lastCurPub=now;remoteRev=Math.max(remoteRev,S.rev||0);REMOTE={...msg};store(KEY,S)}else setTimeout(pushLive,15000)}

function adoptState(d){const keep={tab:S.tab,bets:S.bets,brev:S.brev,lockBets:S.lockBets,seen:S.seen};S={...decS(d),...keep,rev:d.v||0};lastSKey=JSON.stringify(encCore());store(KEY,S)}

function viewerMode(){

  const pull=async()=>{const[a,b]=await Promise.all([latest(TS),latest(TB)]);if(b)onB(b);if(a)onS(a);if(!a)v.innerHTML=liveView(liveState(null,0)).replace('התחרות עוד לא התחילה. הדף יתעדכן לבד.','התחרות עוד לא התחילה. הדף יתעדכן לבד.')};

  if(b&&b.n){remoteBrev=b.v||0;if((b.v||0)>(S.brev||0))adoptBets(b)}
  const subs=await allSince(TI);let n=0;subs.forEach(m=>{try{if(upsertBet(JSON.parse(m.message),m.id))n++}catch(e){}});if(n)toast(`נקלטו ${n} הימורים מהטופס`);

  if(sl!==R.sl){R.sl=sl;const c=S.cfg;if(sl>0&&sl<c.sec){if(c.last5&&sl<=5){say(String(sl));tone(880,.08)}else if(sl%c.every===0){say(sl===10?'עשר שניות!':`נשארו ${sl}`);if(!heVoice)tone(660,.15)}}}
  updTimer();if(left<=0)over(true)}
function over(timeUp){if(R.state==='over')return;clearInterval(R.iv);R.state='over';wake(false);
  if(timeUp){sfx.buzz();say('הזמן נגמר!')}else say(`סיום! ${score(R)} נקודות`);upd()}
const allDone=()=>R.balls.indexOf(null)<0&&R.b3!==null&&R.b5!==null;
function shot(v){if(!R||R.state==='cd')return;const i=R.balls.indexOf(null);if(i<0)return;R.balls[i]=v;R.hist.push(i);
  if(v){val(R.money,i)===2?sfx.money():sfx.make()}else sfx.miss();
  const tail=curStreak();if(tail>=3&&!R.hot){R.hot=true;setTimeout(sfx.hot,150)}if(tail<3)R.hot=false;
  if(allDone()&&R.state==='run')over(false);upd()}
function bonus(k,v){if(!R||R.state==='cd'||R[k]!==null)return;R[k]=v;R.hist.push(k);v?sfx.money():sfx.miss();if(allDone()&&R.state==='run')over(false);upd()}
function curStreak(){let c=0;for(let i=R.balls.length-1;i>=0;i--){if(R.balls[i]===null)continue;if(R.balls[i]===1)c++;else break}return c}
function undo(){if(!R||!R.hist.length)return;const h=R.hist.pop();if(typeof h==='number')R.balls[h]=null;else R[h]=null;R.hot=curStreak()>=3;upd()}
function closeRound(){if(R){clearTimeout(R.cdT);clearInterval(R.iv)}R=null;wake(false);try{speechSynthesis.cancel()}catch(e){}$('#shoot').hidden=true;$('#cd').hidden=true;document.body.style.overflow=''}
function saveRound(){
  let st=S.stages[R.si];const n=R.n,res={balls:R.balls.map(b=>b===1?1:0),b3:R.b3===1?1:0,b5:R.b5===1?1:0,money:R.money,s:score(R),left:Math.round(R.left)};
  if(REMOTE&&REMOTE.p&&(REMOTE.v||0)>roundBase){const keep={tab:S.tab,bets:S.bets,brev:S.brev,lockBets:S.lockBets,seen:S.seen},base={...decS(REMOTE),...keep,rev:REMOTE.v||0},bst=base.stages[R.si];if(bst&&bst.kind===st.kind&&!bst.res[n]){S=base;st=bst}}
  st.res[n]=res;closeRound();moneyPick=4;save();toast(`${n}: ${res.s} נקודות`);
  const up=nextUp(st);if(!up.length)resolve(st);else{render();setTimeout(()=>say(`${n} סיים עם ${res.s}. הבא בתור: ${up[0]}`),300)}
  const bl=betBoard()[0];if(bl&&bl.t>0&&bl.name!==S.betLead){S.betLead=bl.name;save();setTimeout(()=>say(`בהימורים מוביל עכשיו: ${bl.name}`,false),700)}}
function updTimer(){const sl=Math.ceil(R.left),t=$('#tNum');t.textContent=R.state==='cd'?S.cfg.sec:sl;t.classList.toggle('low',R.state==='run'&&sl<=10);$('#tBar').style.width=(R.left/S.cfg.sec*100)+'%'}
function upd(){
  const st=S.stages[R.si],sc=score(R),i=R.balls.indexOf(null);
  $('#shStage').textContent=st.title;$('#shName').textContent=R.n;$('#shScore').textContent=sc;
  $('#shTgt').textContent=R.tgt==null?`מקסימום ${maxScore(R.money)}`:sc>=R.tgt?'עבר את היעד!':`יעד ${R.tgt}`;
  updTimer();$('#shCourt').innerHTML=courtSVG(R);
  const cs=curStreak();$('#shHot').innerHTML=cs>=3?`<span class="hot">בוער! ${cs} ברצף</span>`:R.state==='cd'?'מתכוננים…':R.state==='over'?'':'';
  $('#shWhere').innerHTML=i<0?'כל כדורי העמדות נזרקו':`עמדה ${Math.floor(i/5)+1} · כדור ${i%5+1} מתוך 5${val(R.money,i)===2?' · <b>כדור כסף ×2</b>':''}`;
  $('#bMake').innerHTML=`נכנס<small>${i<0?'—':'+'+val(R.money,i)}</small>`;
  $('#bMake').disabled=$('#bMiss').disabled=i<0||R.state==='cd';
  $('#shBonus').innerHTML=[['b3','שלושת רבע',3],['b5','חצי מגרש',5]].map(([k,l,p])=>`<div class="bn ${R[k]===1?'y':R[k]===0?'n':''}"><div><b>${l}</b><span>${p} נק'</span></div>${R[k]===null?`<button data-b="${k}" data-v="1" ${R.state==='cd'?'disabled':''}>נכנס</button><button data-b="${k}" data-v="0" ${R.state==='cd'?'disabled':''}>החטיא</button>`:`<em>${R[k]?'נכנס! +'+p:'החטיא'}</em>`}</div>`).join('');
  $('#shBanner').innerHTML=R.state==='over'?`<div class="banner">${R.left<=0?'הזמן נגמר':'סיום'} · ${sc} נקודות · אפשר עוד לתקן לפני שמירה</div>`:'';
  pushLive();
  $('#bSave').textContent=R.state==='over'?'שמור תוצאה':'סיים עכשיו';$('#bSave').disabled=R.state==='cd';$('#bUndo').disabled=!R.hist.length}

/* ---------- events ---------- */
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.tab=b.dataset.t;render();scrollTo(0,0)}};
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
$('#bMake').onclick=()=>shot(1);$('#bMiss').onclick=()=>shot(0);$('#bUndo').onclick=undo;
$('#shBonus').onclick=e=>{const b=e.target.closest('[data-b]');if(b)bonus(b.dataset.b,+b.dataset.v)};
$('#bSave').onclick=()=>{if(!R)return;if(R.state==='run')over(false);else if(R.state==='over')saveRound()};
$('#bAbort').onclick=()=>{if(!R)return;const ab=()=>{closeRound();if(REMOTE&&REMOTE.p&&(REMOTE.v||0)>(S.rev||0)){adoptState(REMOTE)}render()};if(!R.hist.length&&R.state!=='over'){ab();return}confirmBox(`לצאת בלי לשמור את הסיבוב של ${esc(R.n)}?`,ab)};
document.addEventListener('keydown',e=>{if(!R||!$('#modal').hidden)return;if(e.key==='ArrowRight'||e.key==='1')shot(1);else if(e.key==='ArrowLeft'||e.key==='0')shot(0);else if(e.key==='Backspace')undo()});
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;const id=t.id;
  if(id==='draw'){ac();let k=0;const p=present();const spin=setInterval(()=>{const o=$('#ord');if(o)o.innerHTML=shuffle(p).map(n=>`<li>${esc(n)}</li>`).join('');tone(400+k*30,.04,'square',.05);if(++k>12){clearInterval(spin);S.order=shuffle(p).concat(S.order.filter(n=>!p.includes(n)));render();say('הסדר הוגרל. ראשון: '+present()[0])}},80)}
  else if(id==='start'){ac();startTour()}
  else if(id==='go')openRound();
  else if(id==='skip'){const st=stg(),n=nextUp(st)[0];st.order=st.order.filter(x=>x!==n).concat(n);render();toast(`${n} עבר לסוף התור`)}
  else if(id==='reset')confirmBox('כל תוצאות הערב יימחקו. ההימורים נשארים.',()=>{S=fresh(S,true);render()});
  else if(id==='again')confirmBox('לפתוח תחרות חדשה? הערב הזה כבר שמור בטבלת העונה, וההימורים יימחקו.',()=>{S=fresh(S);render()});
  else if(id==='goBets'){S.tab='bets';render();scrollTo(0,0)}
  else if(id==='formCp')copy(FORM_URL);
  else if(id==='viewCp')copy(VIEW_URL);
  else if(id==='bkCopy')copy(backupText());
  else if(id==='bkRestore')modal('<h3>שחזור מגיבוי</h3><p class="wait">הדביקו את טקסט הגיבוי המלא. הוא יחליף את מה שיש עכשיו באפליקציה ויתעדכן אצל כולם.</p><textarea id="restoreT"></textarea>',[{t:'ביטול'},{t:'שחזר',c:'pri',f:()=>{const v=(document.getElementById('restoreT')||{}).value||'';confirmBox('לשחזר? המצב הנוכחי יוחלף.',()=>restoreFrom(v))}}]);
  else if(id==='mgrCp')copy(VIEW_URL+'#'+MKEY);
  else if(id==='lockBets'){S.lockBets=!S.lockBets;render();toast(S.lockBets?'ההימורים ננעלו':'ההימורים נפתחו')}
  else if(id==='betAdd'){const got=parseBets($('#betT').value);if(!got.length){toast('לא זיהיתי הימורים בטקסט');return}
    let nw=0,up=0;got.forEach(b=>{const i=S.bets.findIndex(x=>nrm(x.name)===nrm(b.name));if(i>=0){S.bets[i]={...b,ts:Date.now()};up++}else{S.bets.push({...b,ts:Date.now()});nw++}});
    render();toast(`נוספו ${nw}${up?` · עודכנו ${up}`:''}`)}
  else if(t.dataset.bet!=null)betDetail(t.dataset.bet);
  else if(id==='cp')copy(shareText());
  else if(id==='cpRank')copy('דירוג: '+fullRank().join(', '));
  else if(id==='tVoice'){ac();say('נשארו שמונים שניות');tone(660,.15);setTimeout(()=>{pickVoice();render()},800)}
  else if(id==='bak')copy(JSON.stringify(season));
  else if(id==='rest')modal('<h3>שחזור מגיבוי</h3><p class="wait">הדביקו את טקסט הגיבוי. ערבים קיימים לא יוכפלו.</p><textarea id="restT"></textarea>',[{t:'ביטול'},{t:'שחזר',c:'pri',f:()=>{}}]);
  else if(t.dataset.m!=null){moneyPick=+t.dataset.m;render()}
  else if(t.dataset.d){const[si,...n]=t.dataset.d.split('|');detail(+si,n.join('|'))}
  else if(t.dataset.tg){S.cfg[t.dataset.tg]=!S.cfg[t.dataset.tg];render()}
  else if(t.dataset.on!=null){S.players[+t.dataset.on].on=!S.players[+t.dataset.on].on;render()}
  else if(t.dataset.rm!=null){const p=S.players[+t.dataset.rm];confirmBox(`להסיר את ${esc(p.n)} מהרשימה?`,()=>{S.players.splice(S.players.indexOf(p),1);render()})}
  else if(t.dataset.del!=null){const i=+t.dataset.del;confirmBox(`למחוק את הערב מ־${esc(season[i].d)}?`,()=>{season.splice(i,1);store(SKEY,season);render()})}
});
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-i]');const ta=document.getElementById('restT');if(b&&ta&&b.textContent==='שחזר'){try{const d=JSON.parse(ta.value);if(!Array.isArray(d))throw 0;const ids=new Set(season.map(x=>x.id));d.forEach(x=>{if(x&&x.id&&Array.isArray(x.rounds)&&!ids.has(x.id))season.push(x)});season.sort((a,b)=>b.id-a.id);store(SKEY,season);render();toast('שוחזר')}catch(err){toast('הטקסט לא נראה כמו גיבוי')}}},true);
$('#view').addEventListener('submit',e=>{e.preventDefault();const i=$('#addn'),n=i.value.trim();if(!n)return;if(S.players.some(p=>p.n===n)){toast('השם כבר ברשימה');return}S.players.push({n,on:true});render();$('#addn').focus()});
$('#view').addEventListener('change',e=>{const id=e.target.id,v=+e.target.value;if(id==='cSec'&&v>=20&&v<=300)S.cfg.sec=Math.round(v);if(id==='cEv')S.cfg.every=v;if(id==='cFin'&&v>=1&&v<=8)S.cfg.fin=Math.round(v);save()});
render();
if(location.hash==='#'+MKEY)managerSync();else viewerMode();
window.addEventListener('hashchange',()=>location.reload());
}
</script>
</body>
